<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id == null} ? 'Add User' : 'Edit User'">User Form</title>
</head>
<body>
<h2 th:text="${user.id == null} ? 'Add New User' : 'Edit User'">User Form</h2>

<form th:action="@{/users/save}" th:object="${user}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>First Name:</label><br>
    <input type="text" th:field="*{firstName}" required /><br><br>

    <label>Last Name:</label><br>
    <input type="text" th:field="*{lastName}" required /><br><br>

    <label>Email:</label><br>
    <input type="email" th:field="*{email}" required /><br><br>

    <button type="submit">Save</button>
    <a th:href="@{/users}">Cancel</a>
</form>
</body>
</html>
